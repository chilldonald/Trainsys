{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Тренировки{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    {% if user.is_authenticated %}
    <header class="main-header">
        <div class="header-placeholder"></div>
        <a href="{% url 'home' %}"><h1 class="header-title">Тренировки</h1></a>
        <a href="{% url 'profile' %}" class="profile-link">
            <div class="avatar-circle"></div>
        </a>

    </header>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% if user.is_authenticated %}
    <footer class="footer-grid">
        <a href="{% url 'new_workout' %}">
            ✚ Новая тренировка
        </a>
        <a href="{% url 'home' %}">
            🏋️ Тренировки
        </a>
        <a href="{% url 'analytics' %}">
            📈 Аналитика
        </a>
        <a href="{% url 'scoreboard' %}">
            🔥 Топ
        </a>
        <a href="{% url 'profile' %}">
            👤 Профиль
        </a>
    </footer>
    {% endif %}
</body>
</html>
